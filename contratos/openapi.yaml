    post:
      tags: [Pedidos]
      summary: Cancela (→ CANCELADO) ou estorna (→ ESTORNADO se houver pagamento)
      description: |
        ATENDENTE: somente CRIADO/CONFIRMADO. EM_PREPARO, PRONTO e ENTREGUE exigem GERENTE+.
