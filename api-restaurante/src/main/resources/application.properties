# Configuracao do Servidor (escuta em localhost e IP local 192.168.100.36 na porta 8080)
server.port=8080
server.address=0.0.0.0

# Configuracao do MySQL (parametrizada via variaveis de ambiente com fallback local para dev)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cheirocafe_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:0311}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracoes do Hibernate / JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.open-in-view=false
