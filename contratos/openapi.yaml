openapi: 3.1.0
info:
  title: Cafeteria Platform API
  version: 1.0.0-draft
  description: |
    Contrato-fonte (contract-first) da API da plataforma da cafeteria.
    Consumidores: App Android (atendente), Web Master (backoffice), Web KDS (cozinha).

    Convenções:
    - Valores monetários: inteiros em centavos (sufixo `Centavos`).
    - Percentuais: basis points (1500 = 15,00%).
    - IDs: UUIDv7 em string.
    - Datas: ISO-8601 em UTC.
    - Erros: RFC 7807 (`application/problem+json`) com `code` estável (ver catalogo_erros.md).
    - Escrita em recurso versionado exige `versao` no corpo (optimistic locking).
    - POSTs financeiros e de pedido exigem header `Idempotency-Key`.
    - Multi-loja: a loja é derivada da claim `lojaId` do JWT; nunca é enviada no corpo.
servers:
  - url: https://cafeteria.local/api/v1
    description: Servidor on-premise da loja (LAN)
  - url: http://localhost:8080/api/v1
    description: Desenvolvimento
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Catalogo-Categorias
  - name: Catalogo-Produtos
  - name: Catalogo-Modificadores
  - name: Catalogo-Combos
  - name: Catalogo-Insumos
  - name: Catalogo-Projecao
  - name: Pedidos
  - name: Pagamentos
  - name: Caixa
  - name: Cozinha
  - name: Relatorios

paths:
  # ───────────────────────────── AUTH ─────────────────────────────
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Login por usuário/senha
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Renova access token (refresh token rotativo)
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Renovado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoga o refresh token do dispositivo
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '204': { description: Revogado }

  # ─────────────────────────── CATEGORIAS ───────────────────────────
  /categorias:
    get:
      tags: [Catalogo-Categorias]
      summary: Lista categorias (árvore de até 2 níveis)
      operationId: listarCategorias
      x-roles: [ATENDENTE, COZINHA, GERENTE, ADMIN]
      parameters:
        - name: incluirArquivadas
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Árvore de categorias
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CategoriaResponse' }
    post:
      tags: [Catalogo-Categorias]
      summary: Cria categoria ou subcategoria
      operationId: criarCategoria
      x-roles: [GERENTE, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoriaRequest' }
      responses:
        '201':
          description: Criada
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoriaResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /categorias/ordem:
    patch:
      tags: [Catalogo-Categorias]
      summary: Reordena categorias em lote
      operationId: reordenarCategorias
      x-roles: [GERENTE, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/OrdemItem' }
      responses:
        '204': { description: Reordenado }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /categorias/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Catalogo-Categorias]
      operationId: obterCategoria
      x-roles: [ATENDENTE, COZINHA, GERENTE, ADMIN]
      responses:
        '200':
          description: Categoria
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoriaResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Catalogo-Categorias]
      operationId: atualizarCategoria
      x-roles: [GERENTE, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CategoriaRequest'
                - $ref: '#/components/schemas/Versionado'
      responses:
        '200':
          description: Atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoriaResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    delete:
      tags: [Catalogo-Categorias]
      summary: Arquiva categoria (soft delete)
      operationId: arquivarCategoria
      x-roles: [GERENTE, ADMIN]
      responses:
        '204': { description: Arquivada }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ──────────────────────────── PRODUTOS ────────────────────────────
  /produtos:
    get:
      tags: [Catalogo-Produtos]
      operationId: listarProdutos
      x-roles: [ATENDENTE, COZINHA, GERENTE, ADMIN]
      parameters:
        - { name: categoriaId, in: query, schema: { type: string, format: uuid } }
        - { name: q, in: query, schema: { type: string, maxLength: 80 } }
        - { name: tipo, in: query, schema: { $ref: '#/components/schemas/TipoProduto' } }
        - { name: ativo, in: query, schema: { type: boolean } }
        - { name: disponivel, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Página de produtos
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [content]
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/ProdutoResumo' }
    post:
      tags: [Catalogo-Produtos]
      operationId: criarProduto
      x-roles: [GERENTE, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProdutoCriarRequest' }
      responses:
        '201':
          description: Criado
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProdutoDetalhe' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /produtos/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Catalogo-Produtos]
      operationId: obterProduto
      x-roles: [ATENDENTE, COZINHA, GERENTE, ADMIN]
      responses:
        '200':
          description: Produto com grupos, insumos e (se COMBO) slots
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProdutoDetalhe' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Catalogo-Produtos]
      summary: Atualiza dados cadastrais (não altera preço)
      operationId: atualizarProduto
      x-roles: [GERENTE, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProdutoAtualizarRequest' }
      responses:
        '200':
          description: Atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProdutoDetalhe' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    delete:
      tags: [Catalogo-Produtos]
      summary: Arquiva produto
      operationId: arquivarProduto
      x-roles: [GERENTE, ADMIN]
      responses:
        '204': { description: Arquivado }
        '404': { $ref: '#/components/responses/NotFound' }
  /produtos/{id}/preco:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [Catalogo-Produtos]
      summary: Altera preço base e registra histórico
      operationId: alterarPrecoProduto
      x-roles: [GERENTE, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlterarPrecoProdutoRequest' }
      responses:
        '200':
          description: Preço alterado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProdutoDetalhe' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /produtos/{id}/disponibilidade:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [Catalogo-Produtos]
      summary: Pausa/reativa produto (propaga via /topic/disponibilidade)
      operationId: alterarDisponibilidadeProduto
      x-roles: [GERENTE, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PausaRequest' }
      responses:
        '200':
          description: Disponibilidade atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DisponibilidadeResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
  /produtos/{id}/grupos-modificadores:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    put:
      tags: [Catalogo-Produtos]
      summary: Substitui os vínculos de grupos de modificadores do produto
      operationId: vincularGruposModificadores
      x-roles: [GERENTE, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VinculoGruposRequest' }
      responses:
        '200':
          description: Vínculos atualizados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProdutoDetalhe' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /produtos/{id}/insumos:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    put:
      tags: [Catalogo-Produtos]
      summary: Substitui as dependências de insumos do produto
      operationId: vincularInsumosProduto
      x-roles: [GERENTE, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VinculoInsumosRequest' }
      responses:
        '200':
          description: Vínculos atualizados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProdutoDetalhe' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /produtos/{id}/historico-precos:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Catalogo-Produtos]
      operationId: historicoPrecosProduto
      x-roles: [GERENTE, ADMIN]
      responses:
        '200':
          description: Histórico (mais recente primeiro)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HistoricoPrecoResponse' }

  # ───────────────────────────── COMBOS ─────────────────────────────
  /produtos/{id}/combo-slots:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    put:
      tags: [Catalogo-Combos]
      summary: Substitui os slots do combo (produto deve ser tipo COMBO)
      operationId: definirSlotsCombo
      x-roles: [GERENTE, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ComboSlotsRequest' }
      responses:
        '200':
          description: Slots atualizados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProdutoDetalhe' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  # ────────────────────────── MODIFICADORES ──────────────────────────
  /grupos-modificadores:
    get:
      tags: [Catalogo-Modificadores]
      operationId: listarGruposModificadores
      x-roles: [ATENDENTE, COZINHA, GERENTE, ADMIN]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: ativo, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Grupos com modificadores
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GrupoModificadorResponse' }
    post:
      tags: [Catalogo-Modificadores]
      operationId: criarGrupoModificador
      x-roles: [GERENTE, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrupoModificadorCriarRequest' }
      responses:
        '201':
          description: Criado
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrupoModificadorResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /grupos-modificadores/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Catalogo-Modificadores]
      operationId: obterGrupoModificador
      x-roles: [ATENDENTE, COZINHA, GERENTE, ADMIN]
      responses:
        '200':
          description: Grupo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrupoModificadorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Catalogo-Modificadores]
      summary: Atualiza metadados do grupo (modificadores têm rotas próprias)
      operationId: atualizarGrupoModificador
      x-roles: [GERENTE, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrupoModificadorAtualizarRequest' }
      responses:
        '200':
          description: Atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrupoModificadorResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    delete:
      tags: [Catalogo-Modificadores]
      summary: Arquiva grupo (409 se vinculado a produto ativo)
      operationId: arquivarGrupoModificador
      x-roles: [GERENTE, ADMIN]
      responses:
        '204': { description: Arquivado }
        '409': { $ref: '#/components/responses/Conflict' }
  /grupos-modificadores/{id}/modificadores:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Catalogo-Modificadores]
      operationId: criarModificador
      x-roles: [GERENTE, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModificadorRequest' }
      responses:
        '201':
          description: Criado
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModificadorResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /modificadores/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    put:
      tags: [Catalogo-Modificadores]
      summary: Atualiza modificador (preço via rota /preco)
      operationId: atualizarModificador
      x-roles: [GERENTE, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModificadorAtualizarRequest' }
      responses:
        '200':
          description: Atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModificadorResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    delete:
      tags: [Catalogo-Modificadores]
      operationId: arquivarModificador
      x-roles: [GERENTE, ADMIN]
      responses:
        '204': { description: Arquivado }
  /modificadores/{id}/preco:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [Catalogo-Modificadores]
      operationId: alterarPrecoModificador
      x-roles: [GERENTE, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlterarPrecoModificadorRequest' }
      responses:
        '200':
          description: Preço alterado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModificadorResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /modificadores/{id}/disponibilidade:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [Catalogo-Modificadores]
      operationId: alterarDisponibilidadeModificador
      x-roles: [GERENTE, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PausaRequest' }
      responses:
        '200':
          description: Disponibilidade atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DisponibilidadeResponse' }
  /modificadores/{id}/historico-precos:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Catalogo-Modificadores]
      operationId: historicoPrecosModificador
      x-roles: [GERENTE, ADMIN]
      responses:
        '200':
          description: Histórico
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HistoricoPrecoResponse' }

  # ───────────────────────────── INSUMOS ─────────────────────────────
  /insumos:
    get:
      tags: [Catalogo-Insumos]
      operationId: listarInsumos
      x-roles: [ATENDENTE, COZINHA, GERENTE, ADMIN]
      parameters:
        - { name: disponivel, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Insumos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InsumoResponse' }
    post:
      tags: [Catalogo-Insumos]
      operationId: criarInsumo
      x-roles: [GERENTE, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InsumoRequest' }
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InsumoResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
  /insumos/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    put:
      tags: [Catalogo-Insumos]
      operationId: atualizarInsumo
      x-roles: [GERENTE, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/InsumoRequest'
                - $ref: '#/components/schemas/Versionado'
      responses:
        '200':
          description: Atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InsumoResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
  /insumos/{id}/disponibilidade:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [Catalogo-Insumos]
      summary: Marca insumo esgotado/disponível; retorna itens impactados
      operationId: alterarDisponibilidadeInsumo
      x-roles: [COZINHA, GERENTE, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InsumoDisponibilidadeRequest' }
      responses:
        '200':
          description: Disponibilidade atualizada com impacto em cascata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InsumoDisponibilidadeResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────── PROJEÇÃO DE CATÁLOGO ───────────────────────
  /catalogo:
    get:
      tags: [Catalogo-Projecao]
      summary: Catálogo completo de venda com disponibilidade calculada
      description: |
        Projeção de leitura otimizada para Android e balcão. `ETag` = versão do catálogo.
        Enviar `If-None-Match` para receber 304 quando inalterado.
      operationId: obterCatalogo
      x-roles: [ATENDENTE, COZINHA, GERENTE, ADMIN]
      parameters:
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Catálogo
          headers:
            ETag:
              schema: { type: string }
              description: Versão do catálogo entre aspas, ex. "1842"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogoResponse' }
        '304': { description: Catálogo inalterado }

  # ───────────────────────────── PEDIDOS ─────────────────────────────
  /pedidos:
    get:
      tags: [Pedidos]
      operationId: listarPedidos
      x-roles: [ATENDENTE, GERENTE, ADMIN]
      parameters:
        - name: status
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/StatusPedido' }
        - { name: dataOperacional, in: query, schema: { type: string, format: date } }
        - { name: emAberto, in: query, description: Apenas com saldo devedor > 0, schema: { type: boolean } }
        - { name: mesa, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Página de pedidos
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [content]
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/PedidoResponse' }
    post:
      tags: [Pedidos]
      summary: Cria pedido (preços recalculados no servidor)
      operationId: criarPedido
      x-roles: [ATENDENTE, GERENTE, ADMIN]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CriarPedidoRequest' }
      responses:
        '201':
          description: Criado
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PedidoResponse' }
        '200':
          description: Replay idempotente (mesma chave e mesmo payload)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PedidoResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /pedidos/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Pedidos]
      operationId: obterPedido
      x-roles: [ATENDENTE, GERENTE, ADMIN]
      responses:
        '200':
          description: Pedido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PedidoResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
  /pedidos/{id}/confirmar:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Pedidos]
      summary: CRIADO → CONFIRMADO (PRE_PAGO exige quitação)
      operationId: confirmarPedido
      x-roles: [ATENDENTE, GERENTE, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Versionado' }
      responses:
        '200':
          description: Confirmado (ou já estava — idempotente)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PedidoResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /pedidos/{id}/cancelar:
    parameters:
